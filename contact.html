<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | Bérénice Leroy</title>

    <link rel="stylesheet" href="/css/style-contact.css">
</head>

<body>

    <main>
        <section class="contact-page">
            <div class="container">

                <div class="contact-page-header">
                    <p class="section-kicker">Contact</p>
                    <h1>Contactez-moi</h1>
                </div>

                <form class="contact-form" id="contact-form" action="contact.php" method="post">
                    <div class="form-group">
                        <label for="firstname">Prénom</label>
                        <input type="text" id="firstname" name="firstname" required>

                        <label for="lastname">Nom</label>
                        <input type="text" id="lastname" name="lastname" required>

                        <label for="email">Email</label>
                        <input type="email" id="email" name="email">

                        <label for="phone">Téléphone</label>
                        <input type="tel" id="phone" name="phone">

                        <div class="honeypot" aria-hidden="true">
                            <label for="website">Website</label>
                            <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
                        </div>

                        <button type="submit" class="contact-submit">
                            Envoyer ma demande
                        </button>

                        <p class="form-message" id="form-message"></p>

                    </div>
                </form>
            </div>
        </section>
    </main>

    <div class="success-popup" id="success-popup">
        <div class="success-popup-content">
            <p id="success-popup-message"></p>
            <button type="button" id="success-popup-close">OK</button>
        </div>
    </div>

    <script>
        const popup = document.getElementById("success-popup");
        const popupMessage = document.getElementById("success-popup-message");
        const popupClose = document.getElementById("success-popup-close");
        const form = document.getElementById("contact-form");
        let submissionSucceeded = false;

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            submissionSucceeded = false;

            try {
                const response = await fetch(form.action, {
                    method: "POST",
                    body: new FormData(form)
                });

                const result = await response.json();

                if (response.ok && result.success === true) {
                    submissionSucceeded = true;
                    popupMessage.textContent = "Merci, votre demande a été envoyée";
                    form.reset();
                } else {
                    popupMessage.textContent = result.message || "Une erreur est survenue lors de l'envoi. Veuillez réessayer";
                }
            } catch (error) {
                popupMessage.textContent = "Une erreur est survenue lors de l'envoi. Veuillez réessayer";
            }

            popup.classList.add("show");
        });

        popupClose.addEventListener("click", () => {
            popup.classList.remove("show");
            if (submissionSucceeded) {
                window.location.href = "index.html";
            }
        });
    </script>

</body>

</html>
